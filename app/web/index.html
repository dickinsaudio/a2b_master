<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>a2b_master</title>
<style>
:root {
  --bg: #f6f7f9; --panel: #ffffff; --fg: #1d2330; --muted: #6b7280; --line: #d9dde3;
  --accent: #2563eb; --accent-fg: #fff; --ok: #15803d; --ok-bg: #e7f6ec; --bad: #b91c1c; --bad-bg: #fdecec;
  --warn: #a16207; --warn-bg: #fdf6e3; --input: #fff; --row: #fafbfc; --mono: ui-monospace, "Cascadia Mono", Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #14171c; --panel: #1c2027; --fg: #e3e6eb; --muted: #8b93a1; --line: #2e343e;
    --accent: #3b82f6; --ok: #4ade80; --ok-bg: #12301d; --bad: #f87171; --bad-bg: #3a1717;
    --warn: #facc15; --warn-bg: #3a3212; --input: #12151a; --row: #20252d;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--fg); font: 13px/1.4 "Segoe UI", system-ui, sans-serif; display: flex; flex-direction: column; }
header { display: flex; align-items: center; gap: 8px; padding: 6px 12px; background: var(--panel); border-bottom: 1px solid var(--line); flex-wrap: wrap; }
header h1 { font-size: 14px; margin: 0 10px 0 0; letter-spacing: .3px; }
.dot { width: 10px; height: 10px; border-radius: 50%; background: var(--muted); display: inline-block; }
.dot.on { background: var(--ok); } .dot.busy { background: var(--warn); }
nav { display: flex; gap: 2px; padding: 0 12px; background: var(--panel); border-bottom: 1px solid var(--line); }
nav button { border: 0; border-bottom: 2px solid transparent; background: none; color: var(--muted); padding: 7px 12px; border-radius: 0; font-weight: 600; }
nav button.act { color: var(--fg); border-bottom-color: var(--accent); }
main { flex: 1; overflow: auto; padding: 10px 12px; min-height: 0; }
section { display: none; } section.act { display: block; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 10px; margin-bottom: 10px; }
.card h3 { margin: 0 0 8px; font-size: 12px; text-transform: uppercase; color: var(--muted); letter-spacing: .5px; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 6px; }
label { color: var(--muted); display: inline-flex; align-items: center; gap: 4px; }
input, select, button { font: inherit; color: var(--fg); background: var(--input); border: 1px solid var(--line); border-radius: 4px; padding: 3px 6px; }
input[type=checkbox] { padding: 0; }
input.hex { width: 52px; font-family: var(--mono); } input.num { width: 60px; } input.wide { width: 320px; } input.mid { width: 170px; }
button { background: var(--panel); cursor: pointer; padding: 4px 10px; }
button:hover:not(:disabled) { border-color: var(--accent); }
button.pri { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
button:disabled { opacity: .45; cursor: default; }
.mono { font-family: var(--mono); }
.muted { color: var(--muted); }
.ok { color: var(--ok); } .bad { color: var(--bad); } .warn { color: var(--warn); }
table { border-collapse: collapse; width: 100%; font-size: 12px; }
th, td { text-align: left; padding: 2px 6px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { position: sticky; top: 0; background: var(--panel); color: var(--muted); font-weight: 600; z-index: 1; }
tbody tr:nth-child(even) td { background: var(--row); }
tr.rok td { background: var(--ok-bg) !important; } tr.rbad td { background: var(--bad-bg) !important; }
tr.rerr td { background: var(--bad-bg) !important; } tr.rwarn td.w { color: var(--warn); }
td.bytes { font-family: var(--mono); max-width: 520px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
td.res { font-family: var(--mono); white-space: nowrap; }
.tablewrap { max-height: calc(100vh - 360px); min-height: 160px; overflow: auto; border: 1px solid var(--line); border-radius: 4px; }
#log { height: 150px; overflow: auto; background: var(--panel); border-top: 1px solid var(--line); font: 11.5px/1.35 var(--mono); padding: 4px 12px; white-space: pre-wrap; flex: none; }
#logbar { display: flex; justify-content: space-between; align-items: center; padding: 2px 12px; background: var(--panel); border-top: 1px solid var(--line); color: var(--muted); font-size: 11px; }
#logbar button { padding: 0 6px; font-size: 11px; }
.pill { display: inline-block; padding: 1px 7px; border-radius: 9px; font-size: 11px; font-weight: 600; background: var(--row); border: 1px solid var(--line); }
.pill.ok { background: var(--ok-bg); } .pill.bad { background: var(--bad-bg); }
ul.msgs { margin: 4px 0; padding-left: 18px; max-height: 120px; overflow: auto; font-size: 12px; }
#conout { font: 12px/1.4 var(--mono); max-height: 340px; overflow: auto; background: var(--input); border: 1px solid var(--line); border-radius: 4px; padding: 4px 8px; white-space: pre-wrap; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(420px, 1fr)); gap: 10px; }
.kv { display: grid; grid-template-columns: max-content max-content; gap: 2px 10px; }
#toast { position: fixed; right: 14px; bottom: 190px; background: var(--bad); color: #fff; padding: 6px 12px; border-radius: 5px; display: none; max-width: 50vw; }
progress { width: 160px; height: 10px; }
#cstat { font-weight: 600; } #cstat.ok { color: var(--ok); } #cstat.bad { color: var(--bad); }
.btns { display: flex; flex-wrap: wrap; gap: 6px; }
.btns button { padding: 3px 9px; }
</style>
</head>
<body>
<header>
  <h1>a2b_master <span id="ver" class="mono muted" style="font-weight:400"></span></h1>
  <span class="dot" id="cdot"></span>
  <select id="portsel" class="mid" style="width:300px" title="Pico COM port - choosing one (again) connects"></select>
  <span id="cstat" class="muted">not connected</span>
  <span style="flex:1"></span>
  <span id="busy" class="muted"></span>
</header>
<nav>
  <button data-tab="list" class="act">Command list</button>
  <button data-tab="console">Register console</button>
  <button data-tab="tunnel">Port forwarding</button>
</nav>
<main>
<section id="tab-list" class="act">
  <div class="card">
    <div class="row">
      <input type="file" id="xmlfile" accept=".xml,text/xml" hidden>
      <button id="btnChoose" title="SigmaStudio(+) command list export - loads when chosen; choose it again to reload">Choose file...</button>
      <span id="listsum" class="muted">no command list loaded</span>
    </div>
    <div class="row">
      <button id="btnRun" class="pri" title="Runs the list once through the Pico, like a SigmaStudio replay. Nothing is stored on the Pico.">&#9654; Run once</button>
      <label><input type="checkbox" id="stopfail"> stop on first failure</label>
      <progress id="runprog" value="0" max="1"></progress>
      <span id="runstat" class="mono"></span>
    </div>
    <div class="row">
      <span class="muted">Pico boot:</span>
      <button id="btnBoot" title="Store this list on the Pico and run it at every power up (no PC needed)">Save as boot</button>
      <button id="btnClear" title="Stop the Pico running a list at power up">Clear boot</button>
      <span id="bootstat" class="muted"></span>
    </div>
    <div id="msgs"></div>
  </div>
  <div class="tablewrap">
    <table id="rectab">
      <thead><tr><th>#</th><th>CellName</th><th>ParamName</th><th>op</th><th>addr</th><th>bytes</th><th>result</th></tr></thead>
      <tbody></tbody>
    </table>
  </div>
</section>

<section id="tab-console">
  <div class="grid2">
    <div class="card">
      <h3>Main node (0x6A)</h3>
      <div class="btns" id="mainbtns"></div>
      <h3 style="margin-top:12px">Sub-node</h3>
      <div class="row"><label>node <select id="nnode"></select></label></div>
      <div class="btns" id="subbtns"></div>
    </div>
    <div class="card">
      <h3>I2C read / write</h3>
      <div class="row">
        <label>addr 0x<input id="caddr" class="hex" value="6A"></label>
        <label>reg width <select id="cregw"><option value="1">1</option><option value="2">2</option><option value="0">none</option></select></label>
        <label>reg 0x<input id="creg" class="hex" value="02"></label>
        <label>length <input id="clen" class="num" type="number" min="1" max="255" value="1"></label>
        <button id="btnRead" class="pri">Read</button>
      </div>
      <div class="row">
        <label>data <input id="cdata" class="mid mono" placeholder="hex bytes, e.g. 00 01"></label>
        <button id="btnWrite">Write</button>
      </div>
      <div class="row">
        <label>Pico command <input id="rawline" class="mid mono" placeholder="R 6A 3 02"></label>
        <button id="btnRaw">Send</button>
      </div>
    </div>
  </div>
  <div class="card">
    <h3>Results <button id="btnConClear" style="float:right;padding:0 6px">clear</button></h3>
    <div id="conout"></div>
  </div>
</section>

<section id="tab-tunnel">
  <div class="card">
    <div class="row"><span id="tstate"></span><span style="flex:1"></span>
      <button id="btnRescan" title="Scan the A2B bus again and restart forwarding">Rescan bus</button></div>
    <table id="ttab">
      <thead><tr><th>node</th><th>link</th><th>state</th><th>connections (active / queued)</th><th>up</th><th>down</th><th>down rate</th><th>txn/s</th><th>retries / transactions</th></tr></thead>
      <tbody></tbody>
    </table>
  </div>
</section>
</main>
<div id="logbar"><span>Log</span><span><label><input type="checkbox" id="logauto" checked> follow</label> <button id="btnLogClear">clear</button></span></div>
<div id="log"></div>
<div id="toast"></div>

<script>
"use strict";
const $ = id => document.getElementById(id);
let state = {}, list = null, runRes = {}, connected = false, connecting = false;

function toast(msg) {
  const t = $("toast"); t.textContent = msg; t.style.display = "block";
  clearTimeout(toast.h); toast.h = setTimeout(() => t.style.display = "none", 5000);
}
async function api(path, body, raw) {
  const opt = body === undefined ? {} : { method: "POST", body: raw ? body : JSON.stringify(body) };
  const r = await fetch(path, opt);
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || r.statusText);
  return j;
}
async function act(fn) { try { return await fn(); } catch (e) { toast(e.message); } }
const hex2 = v => (v >>> 0).toString(16).toUpperCase().padStart(2, "0");
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
function kb(n) { return n < 10000 ? n + " B" : n < 1e7 ? (n / 1000).toFixed(1) + " kB" : (n / 1e6).toFixed(2) + " MB"; }

// ---- tabs
document.querySelectorAll("nav button").forEach(b => b.onclick = () => {
  document.querySelectorAll("nav button").forEach(x => x.classList.toggle("act", x === b));
  document.querySelectorAll("section").forEach(s => s.classList.toggle("act", s.id === "tab-" + b.dataset.tab));
  try { localStorage.setItem("tab", b.dataset.tab); } catch (e) {}
});
try { const t = location.hash.slice(1) || localStorage.getItem("tab"); if (t) document.querySelector(`nav button[data-tab=${t}]`)?.click(); } catch (e) {}

// ---- connection: choosing a port (even the same one again) connects
const sel = $("portsel");
let ports = [], selPrev = "";
function curPort() { return ((state.port && state.port.url) || "").replace(/^serial:/, ""); }
function fillPorts() {
  const cur = curPort();
  sel.innerHTML = `<option value="">${ports.length ? "choose the Pico port..." : "(no COM ports found)"}</option>` +
    ports.map(p => `<option value="${esc(p.name)}">${esc(p.name)}${p.desc ? " - " + esc(p.desc) : ""}${p.pico ? " (Pico)" : ""}</option>`).join("");
  sel.value = [...sel.options].some(o => o.value === cur) ? cur : "";
}
async function refreshPorts() {
  if (document.activeElement === sel) return;           // don't rebuild an open list
  try { ports = await api("/api/ports") || []; } catch (e) { return; }
  fillPorts();
}
sel.onfocus = () => { selPrev = sel.value; sel.value = ""; };   // so picking the same port fires change
sel.onblur = () => { if (sel.value === "") sel.value = selPrev; };
sel.onchange = () => { if (sel.value) { const v = sel.value; sel.blur(); connect(v); } };
async function connect(port) {
  connecting = true; showConn();
  try { await api("/api/connect", { port }); }
  catch (e) { $("cstat").className = "bad"; $("cstat").textContent = "failed: " + e.message; connecting = false; return; }
  connecting = false; poll();
}
function showConn() {
  const c = $("cstat");
  if (connecting) { c.className = "muted"; c.textContent = "connecting..."; return; }
  if (connected) { c.className = "ok"; c.textContent = "CONNECTED"; }
  else if (!c.textContent.startsWith("failed")) { c.className = "muted"; c.textContent = "not connected"; }
}

// ---- command list
function showList(l) {
  list = l; runRes = {};
  if (!l) return;
  $("listsum").innerHTML = `<b>${esc(l.name)}</b> ` + (l.errors.length
    ? `<span class="pill bad">${l.errors.length} error${l.errors.length > 1 ? "s" : ""}</span>`
    : `<span class="pill ok">file parsed</span> ${l.records.length} commands` +
      (l.warnings.length ? ` &middot; <span class="warn">${l.warnings.length} warnings</span>` : ""));
  $("msgs").innerHTML = (l.errors.length ? `<ul class="msgs bad">${l.errors.map(e => `<li>${esc(e)}</li>`).join("")}</ul>` : "") +
    (l.warnings.length ? `<ul class="msgs warn">${l.warnings.map(e => `<li>${esc(e)}</li>`).join("")}</ul>` : "");
  $("rectab").tBodies[0].innerHTML = l.records.map(r => {
    const cls = r.err ? "rerr" : r.warn ? "rwarn" : "";
    const bytes = r.op === "D" ? r.detail : esc(r.detail);
    return `<tr id="rec${r.idx}" class="${cls}" title="${esc(r.err || r.warn || "")}"><td>${r.idx}</td><td>${esc(r.cell)}</td><td>${esc(r.param)}</td><td>${r.op}</td>` +
      `<td class="mono">${r.op === "D" || r.op === "?" ? "" : "0x" + hex2(r.addr)}</td><td class="bytes w">${bytes}</td><td class="res">${r.err ? '<span class="bad">' + esc(r.err) + "</span>" : ""}</td></tr>`;
  }).join("");
  $("runprog").max = l.nwire || 1; $("runprog").value = 0; $("runstat").textContent = "";
}
$("btnChoose").onclick = () => $("xmlfile").click();
$("xmlfile").onchange = () => act(async () => {
  const f = $("xmlfile").files[0]; if (!f) return;
  showList(await api("/api/list/upload?name=" + encodeURIComponent(f.name), await f.arrayBuffer(), true));
  $("xmlfile").value = "";                               // choosing the same file again reloads it
});
$("btnRun").onclick = () => act(async () => { clearResults(); await api("/api/list/run", { stop: $("stopfail").checked }); });
$("btnBoot").onclick = () => act(async () => {
  if (!confirm("Store this list on the Pico and run it at every power up?")) return;
  await api("/api/list/boot", {}); poll();
});
$("btnClear").onclick = () => act(async () => { await api("/api/list/clear", {}); poll(); });
function showBoot(b) {
  $("bootstat").textContent = !connected ? "" : !b || !b.known ? "" :
    b.on ? `runs a stored list (${b.bytes} bytes) at power up` : "nothing runs at power up";
}
function clearResults() {
  runRes = {};
  if (!list) return;
  list.records.forEach(r => { const tr = $("rec" + r.idx); if (tr && !r.err) { tr.classList.remove("rok", "rbad"); tr.cells[6].innerHTML = ""; } });
  $("runprog").value = 0; $("runstat").textContent = "running...";
}
let lastScroll = 0;
function onRec(r) {
  if (!list || r.idx < 0) return;
  const tr = $("rec" + r.idx); if (!tr) return;
  const ok = r.status === "OK" || r.status === "D";
  const failed = !ok || !!(runRes[r.idx] && runRes[r.idx].failed);
  runRes[r.idx] = { failed };
  tr.classList.toggle("rok", !failed); tr.classList.toggle("rbad", failed);
  let txt = r.status;
  if (r.data) txt += " " + r.data.replace(/(..)/g, "$1 ").trim();
  if (r.text) txt += " " + r.text;
  tr.cells[6].innerHTML = `<span class="${ok ? "ok" : "bad"}">${esc(txt)}</span>`;
  $("runprog").value = r.wire + 1;
  $("runstat").textContent = `${r.wire + 1} / ${list.nwire}`;
  const now = performance.now();
  if (now - lastScroll > 150) { lastScroll = now; tr.scrollIntoView({ block: "nearest" }); }
}
function onDone(s) {
  if (s.err) $("runstat").innerHTML = `<span class="bad">${esc(s.err)}</span>`;
  else $("runstat").innerHTML = `<span class="ok">${s.ok} OK</span>, <span class="${s.failed ? "bad" : "muted"}">${s.failed} failed</span>, ${s.ms} ms`;
}

// ---- register console
const RN = { 0x00: "CHIP", 0x01: "NODEADR", 0x02: "VENDOR", 0x03: "PRODUCT", 0x04: "VERSION", 0x05: "CAPABILITY",
  0x09: "SWCTL", 0x0A: "BCDNSLOTS", 0x0B: "LDNSLOTS", 0x0C: "LUPSLOTS", 0x0D: "DNSLOTS", 0x0E: "UPSLOTS", 0x0F: "RESPCYCS",
  0x10: "SLOTFMT", 0x11: "DATCTL", 0x12: "CONTROL", 0x13: "DISCVRY", 0x14: "SWSTAT", 0x15: "INTSTAT", 0x16: "INTSRC",
  0x17: "INTTYPE", 0x18: "INTPND0", 0x19: "INTPND1", 0x1A: "INTPND2", 0x1B: "INTMSK0", 0x1C: "INTMSK1", 0x1D: "INTMSK2",
  0x3F: "I2CCFG", 0x40: "PLLCTL", 0x41: "I2SGCFG", 0x42: "I2SCFG", 0x52: "PINCFG" };
const MAIN_READS = [["ID", 0x02, 4], ["Control / status", 0x12, 5], ["INTTYPE (clears it)", 0x17, 1], ["Interrupt pend / mask", 0x18, 6],
  ["Slots / format", 0x09, 9], ["I2S / PLL", 0x40, 3], ["PINCFG", 0x52, 1], ["Dump 00-16", 0x00, 0x17]];
const SUB_READS = [["ID", 0x02, 4], ["Control / status", 0x12, 5], ["Slots / format", 0x09, 9], ["I2S / PLL", 0x40, 3],
  ["CHIP", 0x00, 1], ["I2CCFG", 0x3F, 1], ["Dump 00-16", 0x00, 0x17]];
function conOut(line, cls) {
  const d = document.createElement("div"); d.className = cls || ""; d.textContent = new Date().toLocaleTimeString() + "  " + line;
  $("conout").prepend(d);
}
function decode(start, hexs) {
  return hexs.trim().split(/\s+/).map((b, i) => `${RN[start + i] || "0x" + hex2(start + i)} ${b}`).join("  ");
}
async function regRead(who, name, start, n) {
  const label = `${who} ${name}`;
  try {
    const r = who === "main"
      ? await api("/api/i2c", { op: "read", addr: "6A", regw: 1, reg: hex2(start), n })
      : await api("/api/node", { base: "6A", node: +$("nnode").value, reg: hex2(start), n, data: "" });
    conOut(`${label}: ${decode(start, r.data)}`, "ok");
  } catch (e) { conOut(`${label}: ${e.message}`, "bad"); }
}
function quickButtons(id, reads, who) {
  $(id).innerHTML = reads.map((r, i) => `<button data-i="${i}">${esc(r[0])}</button>`).join("");
  $(id).querySelectorAll("button").forEach(b => b.onclick = () => {
    const r = reads[+b.dataset.i]; regRead(who === "sub" ? "node " + $("nnode").value : "main", r[0], r[1], r[2]);
  });
}
quickButtons("mainbtns", MAIN_READS, "main");
quickButtons("subbtns", SUB_READS, "sub");
async function i2c(q, label) {
  try { const r = await api("/api/i2c", q); conOut(label + " -> " + (r.data !== undefined ? r.data : r.reply), "ok"); }
  catch (e) { conOut(label + " -> " + e.message, "bad"); }
}
function regDesc() { return +$("cregw").value ? ` [${$("creg").value.toUpperCase()}]` : ""; }
$("btnRead").onclick = () => i2c({ op: "read", addr: $("caddr").value, regw: +$("cregw").value, reg: $("creg").value, n: +$("clen").value },
  `R ${$("caddr").value.toUpperCase()}${regDesc()} x${$("clen").value}`);
$("btnWrite").onclick = () => i2c({ op: "write", addr: $("caddr").value, regw: +$("cregw").value, reg: $("creg").value, data: $("cdata").value },
  `W ${$("caddr").value.toUpperCase()}${regDesc()} ${$("cdata").value}`);
$("btnRaw").onclick = () => i2c({ op: "raw", line: $("rawline").value }, "> " + $("rawline").value);
$("rawline").onkeydown = e => { if (e.key === "Enter") $("btnRaw").click(); };
$("btnConClear").onclick = () => $("conout").innerHTML = "";
function fillNodes(nodes) {
  const want = (nodes && nodes.length ? nodes : [0]).join(",");
  if ($("nnode").dataset.nodes === want) return;
  const cur = $("nnode").value;
  $("nnode").dataset.nodes = want;
  $("nnode").innerHTML = want.split(",").map(n => `<option>${n}</option>`).join("");
  if (want.split(",").includes(cur)) $("nnode").value = cur;
}

// ---- port forwarding (automatic)
$("btnRescan").onclick = () => act(async () => { await api("/api/tunnel/rescan", {}); poll(); });
function showTunnel(st) {
  const sc = st.scan || {}, t = st.tunnel, tb = $("ttab").tBodies[0];
  $("btnRescan").disabled = !connected || st.run.running;
  $("tstate").innerHTML = !connected ? '<span class="muted">connect the Pico first</span>' :
    t ? `<span class="ok">forwarding</span> &middot; ${esc(sc.msg || "")}` : `<span class="muted">${esc(sc.msg || "")}</span>`;
  const stats = {}; (t ? t.nodes : []).forEach(n => stats[n.node] = n);
  const nodes = sc.nodes || [];
  if (!nodes.length) { tb.innerHTML = `<tr><td colspan="9" class="muted">no sub-nodes</td></tr>`; return; }
  tb.innerHTML = nodes.map(id => {
    const n = stats[id];
    if (!n) return `<tr><td>${id}</td><td class="muted">-</td><td><span class="pill">no tunnel</span></td><td colspan="6"></td></tr>`;
    const pct = n.txn ? (100 * n.retries / n.txn).toFixed(2) + "%" : "-";
    return `<tr><td>${id}</td><td><a href="${n.url}" target="_blank">${n.url}</a></td>` +
      `<td>${n.online ? '<span class="pill ok">reachable</span>' : '<span class="pill bad">unreachable</span>'}</td>` +
      `<td>${n.conns} (${n.active} / ${n.queued})</td><td>${kb(n.up)}</td><td>${kb(n.down)}</td>` +
      `<td>${(n.down_rate / 1000).toFixed(1)} kB/s</td><td>${n.txn_rate.toFixed(0)}</td>` +
      `<td title="NAK ${n.nacks}, CRC ${n.crc}, I/O ${n.io}, gave up ${n.failed}">${n.retries} / ${n.txn} (${pct})</td></tr>`;
  }).join("");
}

// ---- state polling
let first = true;
async function poll() {
  let st;
  try { st = await api("/api/state"); } catch (e) { $("cdot").className = "dot"; $("busy").textContent = "a2b_master not running"; return; }
  state = st; connected = st.connected;
  const p = st.port;
  $("ver").textContent = st.version || "";
  $("cdot").className = "dot" + (connected ? (p.busy || p.queue ? " busy" : " on") : "");
  showConn();
  $("busy").textContent = connected && p.busy ? "busy: " + p.busy + (p.queue > 1 ? ` (${p.queue} queued)` : "") : "";
  $("btnRun").disabled = !connected || !list || list.errors.length > 0 || st.run.running;
  $("btnBoot").disabled = !connected || !list || list.errors.length > 0 || st.run.running;
  $("btnClear").disabled = !connected || st.run.running;
  showBoot(st.boot);
  fillNodes(st.scan && st.scan.nodes);
  if (first) {
    first = false;
    $("stopfail").checked = !!st.settings.stop_on_fail;
    await refreshPorts();
    const last = (st.settings.port || "").replace(/^serial:/, "");
    if (!connected && last && ports.some(x => x.name === last)) connect(last);   // reconnect to the last Pico
    if (st.list) {
      const l = await act(() => api("/api/list")); if (l) showList(l);
      (st.run.results || []).forEach(onRec);
      if (st.run.summary) onDone(st.run.summary);
    }
  }
  if (!connecting && sel.value !== curPort() && document.activeElement !== sel) fillPorts();
  showTunnel(st);
}
setInterval(poll, 1000);
setInterval(refreshPorts, 3000);
poll();

// ---- events (log + run results)
const logEl = $("log");
function addLog(m) {
  const atEnd = logEl.scrollTop + logEl.clientHeight >= logEl.scrollHeight - 4;
  logEl.append(m + "\n");
  if (logEl.childNodes.length > 1500) for (let i = 0; i < 300; i++) logEl.firstChild && logEl.removeChild(logEl.firstChild);
  if ($("logauto").checked || atEnd) logEl.scrollTop = logEl.scrollHeight;
}
$("btnLogClear").onclick = () => logEl.textContent = "";
function connectEvents() {
  logEl.textContent = "";
  const es = new EventSource("/api/events");
  es.onmessage = ev => {
    const e = JSON.parse(ev.data);
    if (e.type === "log") addLog(e.data);
    else if (e.type === "runstart") clearResults();
    else if (e.type === "rec") onRec(e.data);
    else if (e.type === "done") { onDone(e.data); poll(); }
  };
  es.onerror = () => { es.close(); setTimeout(connectEvents, 2000); };
}
connectEvents();
</script>
